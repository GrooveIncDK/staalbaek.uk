<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="css/custom.css">
    <link rel="stylesheet" href="css/bootstrap.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;500;600;700&family=Cinzel+Decorative:wght@700&family=EB+Garamond:ital,wght@0,400;0,500;0,600;1,400;1,500&display=swap" rel="stylesheet">

    <title>Staalbaek Ltd.</title>
    <style>
        :root {
            --sable: #0c0d10;
            --sable-soft: #17191e;
            --parchment: #f2ead9;
            --parchment-deep: #e8dcc0;
            --gules: #7c2430;
            --or: #b9905a;
            --or-bright: #d3ab72;
            --vert: #223f31;
            --tenne: #a45526;
            --ink: #2a251d;
            --ink-soft: #55503f;
            --hairline: rgba(185, 144, 90, 0.35);
        }

        * { box-sizing: border-box; }

        body {
            margin: 0;
            background-color: var(--sable);
            color: var(--parchment);
            font-family: "EB Garamond", serif;
        }

        img { max-width: 100%; }

        /* ---------- Nav ---------- */
        ul.topnav {
            list-style-type: none;
            margin: 10px;
            border-radius: 10px;
            overflow: hidden;
            background-color: var(--sable-soft);
            border: 1px solid var(--hairline);
        }

        ul.topnav li { float: left; }

        ul.topnav li a {
            display: block;
            color: var(--parchment);
            text-align: center;
            padding: 14px 18px;
            text-decoration: none;
            letter-spacing: 0.08em;
            text-transform: uppercase;
            font-size: 0.85rem;
            transition: color 0.2s ease;
        }

        ul.topnav li a:hover:not(.active) { color: var(--or-bright); }
        ul.topnav li a.active { color: var(--or-bright); }
        ul.topnav li.right { float: right; }

        ul.topnav li {
            font-family: "Cinzel", serif;
            font-weight: 600;
        }

        @media screen and (max-width: 600px) {
            ul.topnav li.right,
            ul.topnav li { float: none; }
        }

        /* ---------- Hero ---------- */
        .hero {
            padding: 64px 20px 56px;
            text-align: center;
            background:
                radial-gradient(ellipse at 50% 0%, rgba(185,144,90,0.14), transparent 60%),
                var(--sable);
            border-bottom: 1px solid var(--hairline);
        }

        .hero img.coa {
            width: 100%;
            max-width: 260px;
            margin: 0 auto 28px;
            filter: drop-shadow(0 8px 24px rgba(0,0,0,0.55));
        }

        .hero .eyebrow {
            font-family: "Cinzel", serif;
            font-size: 0.78rem;
            letter-spacing: 0.32em;
            text-transform: uppercase;
            color: var(--or);
            margin-bottom: 10px;
        }

        .hero h1 {
            font-family: "Cinzel Decorative", "Cinzel", serif;
            font-size: clamp(2.1rem, 6vw, 3.6rem);
            margin: 0;
            color: var(--parchment);
            letter-spacing: 0.03em;
        }

        .hero .subtitle {
            font-family: "Cinzel", serif;
            font-size: 1rem;
            letter-spacing: 0.14em;
            text-transform: uppercase;
            color: var(--parchment-deep);
            opacity: 0.75;
            margin-top: 10px;
        }

        .motto-scroll {
            margin: 36px auto 0;
            max-width: 480px;
            padding: 18px 24px;
            border-top: 1px solid var(--hairline);
            border-bottom: 1px solid var(--hairline);
        }

        .motto-scroll .motto {
            font-family: "Cinzel", serif;
            font-style: italic;
            font-size: 1.3rem;
            color: var(--or-bright);
            letter-spacing: 0.04em;
        }

        .motto-scroll .translation {
            font-size: 0.95rem;
            color: var(--parchment-deep);
            opacity: 0.8;
            margin-top: 4px;
        }

        /* ---------- Section shells ---------- */
        .section-intro {
            max-width: 720px;
            margin: 0 auto;
            padding: 56px 24px 8px;
            text-align: center;
        }

        .section-intro h2 {
            font-family: "Cinzel", serif;
            font-size: 1.6rem;
            letter-spacing: 0.06em;
            color: var(--or-bright);
            margin-bottom: 14px;
        }

        .section-intro p {
            color: var(--parchment-deep);
            line-height: 1.7;
            font-size: 1.05rem;
        }

        /* ---------- Blazon sections ---------- */
        .blazon {
            max-width: 900px;
            margin: 24px auto 0;
            padding: 0 20px 40px;
            display: grid;
            gap: 22px;
        }

        .blazon-item {
            background: var(--sable-soft);
            border: 1px solid var(--hairline);
            border-radius: 4px;
            padding: 30px 34px;
            display: grid;
            grid-template-columns: 88px 1fr;
            gap: 24px;
            align-items: start;
        }

        .blazon-item .numeral {
            font-family: "Cinzel Decorative", "Cinzel", serif;
            font-size: 2.4rem;
            color: var(--or);
            opacity: 0.85;
            line-height: 1;
            text-align: center;
            padding-top: 4px;
        }

        .blazon-item .label {
            font-family: "Cinzel", serif;
            font-size: 0.72rem;
            letter-spacing: 0.24em;
            text-transform: uppercase;
            color: var(--tenne);
            display: block;
            margin-bottom: 6px;
        }

        .blazon-item h3 {
            font-family: "Cinzel", serif;
            font-size: 1.3rem;
            margin: 0 0 12px;
            color: var(--parchment);
            letter-spacing: 0.02em;
        }

        .blazon-item p {
            margin: 0;
            color: var(--parchment-deep);
            line-height: 1.75;
            font-size: 1.04rem;
        }

        .blazon-item .swatch-row {
            margin-top: 14px;
            display: flex;
            gap: 8px;
            flex-wrap: wrap;
        }

        .swatch {
            font-family: "Cinzel", serif;
            font-size: 0.68rem;
            letter-spacing: 0.06em;
            text-transform: uppercase;
            padding: 4px 10px;
            border-radius: 20px;
            border: 1px solid var(--hairline);
            color: var(--sable);
        }

        .swatch.sable { background: #1c1c1c; color: var(--parchment); border-color: #444; }
        .swatch.gules { background: var(--gules); color: var(--parchment); }
        .swatch.argent { background: #e9e4d6; }
        .swatch.or { background: var(--or); }
        .swatch.vert { background: var(--vert); color: var(--parchment); }
        .swatch.tenne { background: var(--tenne); color: var(--parchment); }

        @media screen and (max-width: 560px) {
            .blazon-item { grid-template-columns: 1fr; }
            .blazon-item .numeral { text-align: left; padding-top: 0; }
        }

        /* ---------- Interpretation note ---------- */
        .notes {
            max-width: 760px;
            margin: 0 auto 60px;
            padding: 0 24px;
        }

        .notes-inner {
            border-left: 3px solid var(--or);
            padding: 4px 0 4px 22px;
        }

        .notes .label {
            font-family: "Cinzel", serif;
            font-size: 0.7rem;
            letter-spacing: 0.22em;
            text-transform: uppercase;
            color: var(--or);
        }

        .notes p {
            color: var(--parchment-deep);
            font-style: italic;
            line-height: 1.75;
            margin-top: 10px;
        }

        /* ---------- Family history ---------- */
        .history {
            background: var(--parchment);
            color: var(--ink);
            padding: 70px 20px 90px;
        }

        .history-header {
            max-width: 760px;
            margin: 0 auto 46px;
            text-align: center;
        }

        .history-header .eyebrow {
            font-family: "Cinzel", serif;
            font-size: 0.75rem;
            letter-spacing: 0.3em;
            text-transform: uppercase;
            color: var(--gules);
        }

        .history-header h2 {
            font-family: "Cinzel Decorative", "Cinzel", serif;
            font-size: clamp(1.8rem, 4vw, 2.6rem);
            margin: 12px 0 0;
            color: var(--ink);
        }

        .history-grid {
            max-width: 860px;
            margin: 0 auto;
            display: grid;
            gap: 40px;
        }

        .history-block {
            border-top: 1px solid var(--parchment-deep);
            padding-top: 28px;
        }

        .history-block h3 {
            font-family: "Cinzel", serif;
            font-size: 1.25rem;
            color: var(--gules);
            margin: 0 0 6px;
            letter-spacing: 0.02em;
        }

        .history-block .years {
            font-family: "Cinzel", serif;
            font-size: 0.75rem;
            letter-spacing: 0.1em;
            color: var(--ink-soft);
            text-transform: uppercase;
            margin-bottom: 14px;
            display: block;
        }

        .history-block .placeholder {
            border: 1px dashed rgba(124, 36, 48, 0.4);
            border-radius: 4px;
            padding: 18px 20px;
            font-style: italic;
            color: var(--ink-soft);
            line-height: 1.7;
            background: rgba(255,255,255,0.35);
        }

        .history-two-col {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 40px;
        }

        @media screen and (max-width: 640px) {
            .history-two-col { grid-template-columns: 1fr; }
        }

        /* ---------- Footer ---------- */
        .yf-strip {
            text-align: center;
            padding: 50px 20px 20px;
            background: var(--sable);
        }

        .yf-strip .label {
            font-family: "Cinzel", serif;
            letter-spacing: 0.1em;
            text-transform: uppercase;
            font-size: 0.85rem;
            color: var(--parchment-deep);
            margin-bottom: 18px;
        }

        footer {
            width: 100%;
            background-color: var(--sable);
            text-align: center;
            padding: 10px 0 40px;
        }

        footer img {
            width: 34px;
            height: 34px;
            margin: 0 8px;
            opacity: 0.75;
            transition: opacity 0.2s ease;
        }

        footer img:hover { opacity: 1; }
    </style>
</head>
