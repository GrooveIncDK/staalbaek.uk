    <link rel="preconnect" href="https://fonts.googleapis.com">

    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;500;600;700&family=Cinzel+Decorative:wght@700&family=EB+Garamond:ital,wght@0,400;0,500;0,600;1,400;1,500&display=swap" rel="stylesheet">
</head>
<style>
    :root {
        --sable: #0c0d10;
        --sable-soft: #17191e;
        --parchment: #f2ead9;
        --parchment-deep: #e8dcc0;
        --gules: #7c2430;
        --or: #b9905a;
        --or-bright: #d3ab72;
        --ink: #2a251d;
        --ink-soft: #55503f;
        --hairline: rgba(185, 144, 90, 0.35);
    }

    * { box-sizing: border-box; }

    body {
        margin: 0;
        background-color: var(--sable);
        color: var(--parchment);
        font-family: "EB Garamond", serif;
    }

    ul.topnav {
    list-style-type: none;
    margin: 10px;
    border-radius: 10px;
    overflow: hidden;
    background-color: var(--sable-soft);
    border: 1px solid var(--hairline);
    display: flex;
    justify-content: space-between;
    align-items: center;
    flex-wrap: wrap;
}

ul.topnav .nav-group {
    display: flex;
}

ul.topnav li {
    /* float removed — flex handles layout now */
}

ul.topnav li a {
    display: block;
    color: var(--parchment);
    text-align: center;
    padding: 14px 18px;
    text-decoration: none;
    letter-spacing: 0.08em;
    text-transform: uppercase;
    font-size: 0.85rem;
    transition: color 0.2s ease;
}

ul.topnav li a:hover:not(.active) { color: var(--or-bright); }
ul.topnav li a.active { color: var(--or-bright); }

ul.topnav li {
    font-family: "Cinzel", serif;
    font-weight: 600;
}

@media screen and (max-width: 600px) {
    ul.topnav { flex-direction: column; }
    ul.topnav .nav-group { flex-direction: column; width: 100%; }
}

    .hero {
        padding: 64px 20px 56px;
        text-align: center;
        background:
            radial-gradient(ellipse at 50% 0%, rgba(185,144,90,0.14), transparent 60%),
            var(--sable);
        border-bottom: 1px solid var(--hairline);
    }

    .hero img.crest {
        width: 100%;
        max-width: 180px;
        margin: 0 auto 26px;
        filter: drop-shadow(0 8px 24px rgba(0,0,0,0.55));
    }

    .hero .eyebrow {
        font-family: "Cinzel", serif;
        font-size: 0.78rem;
        letter-spacing: 0.32em;
        text-transform: uppercase;
        color: var(--or);
        margin-bottom: 10px;
    }

    .hero h1 {
        font-family: "Cinzel Decorative", "Cinzel", serif;
        font-size: clamp(2.1rem, 6vw, 3.2rem);
        margin: 0;
        color: var(--parchment);
        letter-spacing: 0.03em;
    }

    .page-body {
        background: var(--parchment);
        color: var(--ink);
        padding: 70px 20px 90px;
    }

    .page-body .inner {
        max-width: 560px;
        margin: 0 auto;
        text-align: center;
    }

    .contact-grid {
        display: grid;
        gap: 34px;
        margin-top: 10px;
    }

    .contact-block .label {
        font-family: "Cinzel", serif;
        font-size: 0.75rem;
        letter-spacing: 0.24em;
        text-transform: uppercase;
        color: var(--gules);
        display: block;
        margin-bottom: 10px;
    }

    .contact-block .value {
        font-size: 1.15rem;
        color: var(--ink);
        line-height: 1.7;
    }

    .contact-block .value a {
        color: var(--ink);
        text-decoration: none;
        border-bottom: 1px solid rgba(124, 36, 48, 0.35);
    }

    .contact-block .value a:hover { border-bottom-color: var(--gules); }

    .contact-block { border-top: 1px solid var(--parchment-deep); padding-top: 26px; }
    .contact-block:first-child { border-top: none; padding-top: 0; }
/* ---------- Footer ---------- */
        .yf-strip {
            text-align: center;
            padding: 50px 20px 20px;
            background: var(--sable);
        }

        .yf-strip .label {
            font-family: "Cinzel", serif;
            letter-spacing: 0.1em;
            text-transform: uppercase;
            font-size: 0.85rem;
            color: var(--parchment-deep);
            margin-bottom: 18px;
        }

        footer {
            width: 100%;
            background-color: var(--sable);
            text-align: center;
            padding: 10px 0 40px;
        }

        footer img {
            width: 34px;
            height: 34px;
            margin: 0 8px;
            opacity: 0.75;
            transition: opacity 0.2s ease;
        }

        footer img:hover { opacity: 1; }
</style>
